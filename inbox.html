<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AR Tours — Inbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<style>
:root{
--brand:#128C7E; --brand-dark:#075E54; --green:#25D366; --accent:#34B7F1;
--bg:#f0f2f5; --panel:#fff; --ink:#111b21; --muted:#667781; --line:#e9edef;
--bubble-in:#fff; --bubble-out:#d9fdd3; --alert:#e0442b; --alert-bg:#fdeceb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}

/* ===== App shell: mobile-first single pane, desktop gets a 2nd column ===== */
.app{display:flex;height:100vh;height:100dvh}
.side{background:var(--panel);display:flex;flex-direction:column;width:100%;min-width:0}
.chat{display:none;flex-direction:column;min-width:0;background:#efeae2;background-image:linear-gradient(rgba(229,221,213,.6),rgba(229,221,213,.6));width:100%}
.app.show-chat .side{display:none}
.app.show-chat .chat{display:flex}

@media(min-width:860px){
.app{display:grid;grid-template-columns:380px 1fr}
.side{display:flex !important;border-right:1px solid var(--line)}
.chat{display:flex !important}
.app.show-chat .side{display:flex !important}
}

/* ===== Sidebar / conversation list ===== */
.side-head{background:var(--brand-dark);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{width:36px;height:36px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.side-head h1{font-size:15px;font-weight:600;line-height:1.2}
.side-head .sub{font-size:11px;opacity:.75}
.search{padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.search input{width:100%;padding:10px 14px;border:none;border-radius:20px;background:var(--bg);font-size:15px;outline:none}
.section-label{padding:10px 16px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.convos{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.convo{display:flex;gap:12px;padding:13px 16px;cursor:pointer;border-bottom:1px solid #f5f6f6;align-items:center}
.convo:active{background:#eceeef}
.convo.active{background:#e7f8ef}
.convo.needs-human{background:#fff8f7}
.convo.needs-human.active{background:#e7f8ef}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0;text-transform:uppercase;position:relative}
.avatar .dot{position:absolute;bottom:0;right:0;width:14px;height:14px;border-radius:50%;background:var(--alert);border:2px solid var(--panel)}
.convo-body{flex:1;min-width:0}
.convo-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.convo-name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-time{font-size:11.5px;color:var(--muted);flex-shrink:0}
.convo-prev{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag-tour{background:#e7f3fb;color:#0a6ea8}
.tag-human{background:var(--alert-bg);color:var(--alert)}

/* ===== Chat header ===== */
.chat-head{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{display:flex;background:none;border:none;font-size:22px;color:var(--brand-dark);cursor:pointer;padding:4px 6px 4px 0;flex-shrink:0}
@media(min-width:860px){.back-btn{display:none}}
.chat-head .avatar{width:40px;height:40px;font-size:15px}
.chat-head .info{flex:1;min-width:0}
.chat-head .n{font-weight:600;font-size:15px}
.chat-head .s{font-size:12px;color:var(--muted)}
.status-pill{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
.pill-open{background:#e7f8ef;color:var(--brand-dark)}
.pill-closed{background:#fde8e8;color:#b42318}
.pill-human{background:var(--alert-bg);color:var(--alert)}

/* ===== Bokun booking card ===== */
.bokun-card{margin:10px 8% 0;background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(11,20,26,.12);border-left:4px solid var(--accent)}
.bokun-card .bt{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.bokun-card .bn{font-weight:600;font-size:14.5px}
.bokun-card .bd{font-size:13px;color:var(--muted);margin-top:3px}
.bokun-card .bstatus{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:#e7f3fb;color:#0a6ea8}

/* ===== Messages ===== */
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 4% 8px;display:flex;flex-direction:column;gap:6px}
@media(min-width:860px){.msgs{padding:24px 8%}}
.bubble{max-width:80%;padding:8px 12px;border-radius:8px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px .5px rgba(11,20,26,.08);position:relative}
@media(min-width:860px){.bubble{max-width:62%}}
.in{align-self:flex-start;background:var(--bubble-in);border-top-left-radius:0}
.out{align-self:flex-end;background:var(--bubble-out);border-top-right-radius:0}
.meta{display:block;font-size:10.5px;color:var(--muted);text-align:right;margin-top:3px}
.daysep{align-self:center;background:rgba(255,255,255,.85);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:8px;margin:8px 0}
.media-bubble{max-width:75%;border-radius:8px;overflow:hidden}
@media(min-width:860px){.media-bubble{max-width:300px}}
.media-img{width:100%;height:auto;display:block}
.media-file{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:6px;margin:4px 0}
.media-icon{font-size:20px}
.media-info{flex:1;min-width:0}
.media-name{font-size:12px;font-weight:600;word-break:break-word}
.media-size{font-size:10px;color:var(--muted);margin-top:2px}
.media-link{color:var(--brand);text-decoration:none;font-weight:600;cursor:pointer}
.media-link:hover{text-decoration:underline}

/* ===== Quick actions + composer (big thumb targets) ===== */
.quick{display:flex;gap:6px;padding:8px 10px 0;flex-wrap:wrap;flex-shrink:0}
.quick button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 14px;font-size:13px;color:var(--brand-dark);cursor:pointer;white-space:nowrap}
.quick button:active{background:#e7f8ef}
.composer{background:var(--panel);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);flex-shrink:0}
.composer input{flex:1;padding:13px 16px;border:none;border-radius:24px;background:var(--bg);font-size:16px;outline:none;min-width:0}
.composer button{background:var(--green);color:#fff;border:none;width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.composer button:disabled{background:#9fd8ba;cursor:not-allowed}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;gap:8px;padding:40px}
.empty .big{font-size:56px}
.warn{background:#fff3cd;color:#7a5c00;padding:10px 6%;font-size:13px;border-top:1px solid #f0e0a8;flex-shrink:0}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="side">
<div class="side-head">
<div class="logo">AR</div>
<div style="flex:1"><h1>AR Tours</h1><div class="sub">Inbox</div></div>
<button id="newMsgBtn" title="Message a new customer" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex-shrink:0">+</button>
</div>
<div class="search"><input id="search" placeholder="Search chats..." /></div>
<div class="convos" id="convos"></div>
</aside>
<main class="chat">
<div id="chatHead" class="chat-head" style="display:none">
<button class="back-btn" id="backBtn">←</button>
<div class="avatar" id="chAvatar"></div>
<div class="info"><div class="n" id="chName"></div><div class="s" id="chPhone"></div></div>
<span class="status-pill" id="chStatus"></span>
</div>
<div id="bokunCard"></div>
<div class="msgs" id="msgs"><div class="empty"><div class="big">💬</div><div><b>AR Tours Inbox</b></div><div>Select a conversation to start replying.</div></div></div>
<div id="warn" class="warn" style="display:none"></div>
<div class="quick" id="quick" style="display:none">
<button data-q="Thanks for reaching out to AR Tours! How can we help with your trip? 😊">👋 Greeting</button>
<button data-q="Could you share your travel dates, number of travellers, and pickup location so we can prepare a quote?">📋 Ask details</button>
<button data-q="Thank you! Our team will prepare the best options and confirm shortly. 🙏">✅ Wrap up</button>
</div>
<div id="composer" class="composer" style="display:none">
<input id="input" placeholder="Type a message..." />
<button id="send">➤</button>
</div>
</main>
</div>

<!-- New message modal: cold outreach via approved WhatsApp template -->
<div id="newMsgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px">
<div style="background:#fff;border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto">
<div style="font-weight:700;font-size:16px;margin-bottom:4px">New message</div>
<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">To message someone who hasn't texted you yet, WhatsApp requires an approved template — free text isn't allowed for a first contact.</div>
<label style="font-size:12px;font-weight:600;color:var(--muted)">Phone (with country code, no +)</label>
<input id="nmPhone" placeholder="61491234567" style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:4px 0 12px;font-size:15px">
<label style="font-size:12px;font-weight:600;color:var(--muted)">Customer name (for inbox record)</label>
<input id="nmName" placeholder="Sarah" style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:4px 0 12px;font-size:15px">
<label style="font-size:12px;font-weight:600;color:var(--muted)">Send from</label>
<select id="nmFrom" style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:4px 0 12px;font-size:15px">
<option value="main">+61 400 044 004 (main)</option>
<option value="second">+61 400 040 243</option>
</select>
<label style="font-size:12px;font-weight:600;color:var(--muted)">Template</label>
<select id="nmTemplate" style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:4px 0 12px;font-size:15px">
<option value="inquiry_followup">inquiry_followup — "Hi {{1}}, following up on your {{2}} interest..."</option>
</select>
<label style="font-size:12px;font-weight:600;color:var(--muted)">{{1}} First name</label>
<input id="nmVar1" placeholder="Sarah" style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:4px 0 12px;font-size:15px">
<label style="font-size:12px;font-weight:600;color:var(--muted)">{{2}} Tour name</label>
<input id="nmVar2" placeholder="Great Ocean Road" style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:4px 0 16px;font-size:15px">
<div id="nmWarn" style="display:none;background:#fdeceb;color:#e0442b;font-size:13px;padding:8px 10px;border-radius:8px;margin-bottom:12px"></div>
<div style="display:flex;gap:10px">
<button id="nmCancel" style="flex:1;padding:12px;border-radius:24px;border:1px solid var(--line);background:#fff;font-size:14.5px;cursor:pointer">Cancel</button>
<button id="nmSend" style="flex:1;padding:12px;border-radius:24px;border:none;background:var(--green);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer">Send</button>
</div>
</div>
</div>

<script>
let cur=null, allConvos=[], seen={};
const initials=n=>{if(!n)return'?';const p=n.trim().split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();};
const esc=s=>{const d=document.createElement('div');d.innerText=s||'';return d.innerHTML;};
const fmtTime=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const fmtDay=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return'Today';const y=new Date(n);y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'});};
const fmtSize=(b)=>b<1024?b+'B':b<1024*1024?(b/1024).toFixed(1)+'KB':(b/(1024*1024)).toFixed(1)+'MB';

async function loadConvos(){
const r=await fetch('/inbox/api/conversations');if(!r.ok)return;
allConvos=await r.json();render();
}

function render(){
const q=(document.getElementById('search').value||'').toLowerCase();
const list=document.getElementById('convos');list.innerHTML='';

let filtered=allConvos.filter(c=>!q||(c.name||'').toLowerCase().includes(q)||c.phone.includes(q));
// Needs-human / unreplied first, then most recent.
filtered.sort((a,b)=>{
if((!!b.needsHuman) - (!!a.needsHuman)!==0) return (b.needsHuman?1:0)-(a.needsHuman?1:0);
return (b.lastAt||'').localeCompare(a.lastAt||'');
});

const needHuman=filtered.filter(c=>c.needsHuman);
const rest=filtered.filter(c=>!c.needsHuman);

function renderRow(c){
const unread=seen[c.phone]!==c.lastAt && c.phone!==cur;
const d=document.createElement('div');
d.className='convo'+(c.phone===cur?' active':'')+(c.needsHuman?' needs-human':'');
let tags='';
if(c.needsHuman) tags+='<span class="tag tag-human">🙋 Needs you</span>';
if(c.tour && c.tour.tourName) tags+=`<span class="tag tag-tour">${esc(c.tour.tourName.slice(0,22))}${c.tour.pax?' · '+c.tour.pax+'p':''}</span>`;
d.innerHTML=`<div class="avatar">${esc(initials(c.name||c.phone))}${c.needsHuman?'<span class="dot"></span>':''}</div>
<div class="convo-body"><div class="convo-top"><span class="convo-name">${esc(c.name||c.phone)}</span><span class="convo-time">${fmtTime(c.lastAt)}</span></div>
<div class="convo-prev"><span>${esc((c.preview||'').slice(0,40))}</span>${unread?'<span class="tag tag-human" style="padding:2px 7px">●</span>':''}</div>
${tags?`<div class="tags">${tags}</div>`:''}</div>`;
d.onclick=()=>openChat(c.phone,c.name);
list.appendChild(d);
}

if(needHuman.length){
const lbl=document.createElement('div');lbl.className='section-label';lbl.innerText='Needs you';list.appendChild(lbl);
needHuman.forEach(renderRow);
}
if(rest.length){
if(needHuman.length){const lbl=document.createElement('div');lbl.className='section-label';lbl.innerText='All chats';list.appendChild(lbl);}
rest.forEach(renderRow);
}
if(!filtered.length){
const empty=document.createElement('div');empty.style.padding='30px 16px';empty.style.color='var(--muted)';empty.style.textAlign='center';empty.innerText='No conversations yet.';list.appendChild(empty);
}
}

async function openChat(phone,name){
cur=phone;const c=allConvos.find(x=>x.phone===phone);if(c)seen[phone]=c.lastAt;
document.getElementById('app').classList.add('show-chat');
document.getElementById('chatHead').style.display='flex';
document.getElementById('composer').style.display='flex';
document.getElementById('quick').style.display='flex';
document.getElementById('chAvatar').innerText=initials(name||phone);
document.getElementById('chName').innerText=name||phone;
document.getElementById('chPhone').innerText='+'+phone;
await loadBokunCard(phone);
await loadMsgs();
render();
document.getElementById('input').focus();
}

async function loadBokunCard(phone){
const holder=document.getElementById('bokunCard');holder.innerHTML='';
try{
const r=await fetch('/inbox/api/conversations/'+phone+'/bokun-bookings');
if(!r.ok)return;
const bookings=await r.json();
if(!bookings || !bookings.length) return;
const b=bookings[0];
const card=document.createElement('div');card.className='bokun-card';
card.innerHTML=`<div class="bt">📅 Bokun Booking</div>
<div class="bn">${esc(b.tourName||'Tour')}</div>
<div class="bd">${b.date?esc(b.date):'Date TBC'}${b.pax?' · '+esc(String(b.pax))+' pax':''}${b.price?' · $'+esc(String(b.price))+' '+esc(b.currency||'AUD'):''}</div>
<span class="bstatus">${esc(b.status||'confirmed')}</span>`;
holder.appendChild(card);
}catch(e){/* best-effort, ignore */}
}

async function loadMsgs(){
if(!cur)return;const r=await fetch('/inbox/api/conversations/'+cur+'/messages');const ms=await r.json();
const box=document.getElementById('msgs');box.innerHTML='';let lastDay='';
ms.forEach(m=>{
const day=fmtDay(m.at);if(day!==lastDay){const s=document.createElement('div');s.className='daysep';s.innerText=day;box.appendChild(s);lastDay=day;}
const b=document.createElement('div');
if(m.media && m.media.length>0){
m.media.forEach(med=>{
const mb=document.createElement('div');mb.className='bubble media-bubble '+(m.dir==='inbound'?'in':'out');
if(['image','jpeg','jpg','png'].some(t=>med.mime.includes(t))){
const img=document.createElement('img');img.className='media-img';img.src='/inbox/api/media/'+med.id;img.alt='Image';mb.appendChild(img);
}else{
const icon={'document':'📄','audio':'🔊','video':'🎥','file':'📎'}[med.type]||'📎';
const mf=document.createElement('div');mf.className='media-file';
mf.innerHTML=`<div class="media-icon">${icon}</div>
<div class="media-info"><div class="media-name"><a class="media-link" href="/inbox/api/media/${med.id}" download="${esc(med.filename)}">${esc(med.filename)}</a></div>
<div class="media-size">${fmtSize(med.size)}</div></div>`;
mb.appendChild(mf);
}
const ts=document.createElement('span');ts.className='meta';ts.innerText=fmtTime(m.at)+(m.dir==='outbound'?' ✓✓':'');mb.appendChild(ts);
box.appendChild(mb);
});
}else{
b.className='bubble '+(m.dir==='inbound'?'in':'out');
b.innerHTML=esc(m.body)+`<span class="meta">${fmtTime(m.at)}${m.dir==='outbound'?' ✓✓':''}</span>`;box.appendChild(b);
}
});
const wr=await fetch('/inbox/api/conversations/'+cur+'/window').then(r=>r.json()).catch(()=>({open:true}));
const convo=allConvos.find(c=>c.phone===cur);
const pill=document.getElementById('chStatus');
if(convo && convo.needsHuman){pill.className='status-pill pill-human';pill.innerText='🙋 Needs you';}
else if(wr.open){pill.className='status-pill pill-open';pill.innerText='● Open';}
else{pill.className='status-pill pill-closed';pill.innerText='● 24h closed';}
if(!wr.open){document.getElementById('warn').style.display='block';document.getElementById('warn').innerText='This customer has not messaged in the last 24 hours. WhatsApp blocks free-text replies now — an approved template is required.';}
else{document.getElementById('warn').style.display='none';}
box.scrollTop=box.scrollHeight;
}

async function send(){
const i=document.getElementById('input');const body=i.value.trim();if(!body||!cur)return;
const btn=document.getElementById('send');btn.disabled=true;
try{const r=await fetch('/inbox/api/conversations/'+cur+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});
const d=await r.json();
if(!r.ok){document.getElementById('warn').style.display='block';document.getElementById('warn').innerText=d.message||'Could not send.';}
else{i.value='';await loadMsgs();await loadConvos();}
}catch(e){alert('Network error');}finally{btn.disabled=false;i.focus();}
}

document.getElementById('send').onclick=send;
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
document.getElementById('search').addEventListener('input',render);
document.getElementById('backBtn').addEventListener('click',()=>{document.getElementById('app').classList.remove('show-chat');cur=null;render();});
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{document.getElementById('input').value=b.dataset.q;document.getElementById('input').focus();});

loadConvos();
setInterval(()=>{loadConvos();if(cur)loadMsgs();},5000);

// ===== New message modal (cold outreach via approved template) =====
const nmModal=document.getElementById('newMsgModal');
document.getElementById('newMsgBtn').onclick=()=>{
document.getElementById('nmPhone').value='';
document.getElementById('nmName').value='';
document.getElementById('nmVar1').value='';
document.getElementById('nmVar2').value='';
document.getElementById('nmWarn').style.display='none';
nmModal.style.display='flex';
document.getElementById('nmPhone').focus();
};
document.getElementById('nmCancel').onclick=()=>{nmModal.style.display='none';};
nmModal.addEventListener('click',e=>{if(e.target===nmModal)nmModal.style.display='none';});

document.getElementById('nmSend').onclick=async()=>{
const phone=document.getElementById('nmPhone').value.trim().replace(/[^0-9]/g,'');
const name=document.getElementById('nmName').value.trim();
const template=document.getElementById('nmTemplate').value;
const from=document.getElementById('nmFrom').value;
const v1=document.getElementById('nmVar1').value.trim();
const v2=document.getElementById('nmVar2').value.trim();
const warn=document.getElementById('nmWarn');
if(!phone){warn.style.display='block';warn.innerText='Enter a phone number.';return;}
const btn=document.getElementById('nmSend');btn.disabled=true;btn.innerText='Sending...';
try{
const r=await fetch('/inbox/api/send-template',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,name,template,language:'en',params:[v1,v2],from})});
const d=await r.json();
if(!r.ok){warn.style.display='block';warn.innerText=d.message||'Could not send. Check the template is approved in Meta WhatsApp Manager.';}
else{nmModal.style.display='none';await loadConvos();openChat(phone,name||phone);}
}catch(e){warn.style.display='block';warn.innerText='Network error.';}
finally{btn.disabled=false;btn.innerText='Send';}
};
</script>
</body>
</html>
